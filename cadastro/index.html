<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cadastro do atleta — CMTeam</title>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
:root{--red:#CB333B;--ink:#1A1A1A;--dark:#111111;--sand:#F6F4F1;--line:#E4E1DD;--muted:#5A5A5A;--gold:#FFC72C}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased}
.disp{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase}
a{color:var(--red)}
.top{background:var(--dark);color:#fff}
.top .in{max-width:880px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:28px;width:auto;display:block}
.lang{display:flex;border:1.5px solid #4A4A4A;border-radius:999px;overflow:hidden}
.lang button{background:transparent;color:#D6D6D6;border:0;font:inherit;font-size:13px;font-weight:700;letter-spacing:1px;padding:0 14px;min-height:40px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--dark)}
.hero{background:var(--dark);color:#fff;padding:28px 20px 40px}
.hero .in{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.hero h1{margin:0;font-size:56px;line-height:.95}
.hero p{margin:0;font-size:17px;line-height:1.6;color:#C9C9C9;max-width:680px}
.hero .sig{font-size:15px;color:#fff;font-weight:700}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}
.progress{position:sticky;top:0;z-index:5;background:var(--sand);padding:18px 0 14px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:999px;background:#DDD8D2}
.steps span.past{background:var(--red)}
.steps span.cur{background:var(--ink)}
.plabel{margin-top:10px;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border-radius:20px;padding:36px;margin-top:24px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card h2{margin:0 0 6px;font-size:40px;line-height:1}
.card .lead{margin:0 0 8px;font-size:16px;line-height:1.6;color:var(--muted)}
.sub{margin:34px 0 4px;font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--red);padding-top:22px;border-top:1px solid var(--line)}
.sub:first-of-type{border-top:0;padding-top:0}
.subnote{margin:0 0 6px;font-size:14px;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px}
.f{display:flex;flex-direction:column;gap:8px;margin-top:18px;min-width:0}
.f.full{grid-column:1 / -1}
.f>label,.f>.lbl{font-size:15px;font-weight:700;line-height:1.35}
.req{color:var(--red)}
.hint{font-size:13px;color:var(--muted);line-height:1.4;margin-top:-2px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sand);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--sand);font-size:15px;cursor:pointer;user-select:none}
.opt input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.opt input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.big .opt span{min-height:64px;padding:0 22px;font-size:17px;font-weight:700;border-radius:16px}
.scale .opt span{width:48px;justify-content:center;padding:0}
.scalelegend{display:flex;justify-content:space-between;max-width:288px;font-size:12px;color:var(--muted)}
.matrix{overflow-x:auto;margin-top:6px}
.matrix table{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.matrix th,.matrix td{padding:8px 6px;text-align:center;font-size:14px}
.matrix th{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase}
.matrix td:first-child,.matrix th:first-child{text-align:left;font-weight:700;color:var(--ink);font-size:14px;letter-spacing:0;text-transform:none;white-space:nowrap;padding-right:14px}
.matrix tr+tr td{border-top:1px solid var(--line)}
.cb{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer}
.cb input{width:22px;height:22px;accent-color:var(--red);cursor:pointer}
.race{border:1.5px solid var(--line);border-radius:14px;padding:4px 18px 18px;margin-top:14px;position:relative}
.race .rm{position:absolute;top:10px;right:10px;background:transparent;border:0;color:var(--muted);font-size:14px;cursor:pointer;min-height:36px;padding:0 10px;border-radius:8px}
.race .rm:hover{background:var(--sand);color:var(--red)}
.addbtn{margin-top:14px;background:transparent;border:1.5px dashed #BDB7B0;border-radius:12px;min-height:48px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;width:100%}
.addbtn:hover{border-color:var(--red);color:var(--red)}
.alert{margin-top:18px;background:#FFF4D6;border:1.5px solid var(--gold);border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.5}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:15px;line-height:1.5;cursor:pointer}
.consent input{width:22px;height:22px;margin-top:1px;accent-color:var(--red);flex-shrink:0}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
.btn{font:inherit;font-size:16px;font-weight:700;border-radius:999px;min-height:54px;padding:0 28px;cursor:pointer;border:0}
.btn.pri{background:var(--red);color:#fff;margin-left:auto}
.btn.pri:hover{background:#B02A31}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid #BDB7B0}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:#B3261E;font-size:14px;margin-top:10px;min-height:1em}
.f.invalid input,.f.invalid select,.f.invalid textarea{border-color:#B3261E}
.f.invalid .opts .opt span{border-color:#E7A5A1}
.saved{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
.done{text-align:center;padding:56px 36px}
.done h2{font-size:48px}
.foot{text-align:center;font-size:13px;color:var(--muted);padding:24px 20px 40px}
@media (max-width:700px){
.hero h1{font-size:40px}
.card{padding:24px 18px;border-radius:16px}
.card h2{font-size:32px}
.grid{grid-template-columns:minmax(0,1fr)}
.btn{padding:0 20px}
.matrix table{min-width:0}
.matrix th,.matrix td{padding:6px 1px;font-size:11px}
.matrix td:first-child,.matrix th:first-child{white-space:normal;font-size:13px;padding-right:6px}
.cb{width:30px;height:36px}
.cb input{width:20px;height:20px}
}
</style>
</head>
<body>
<div class="top"><div class="in">
<a href="../" aria-label="CMTeam"><img src="../img/cmteam-logo-branco.png" alt="CMTeam"></a>
<div class="lang" role="group" aria-label="Idioma / Language">
<button type="button" data-lang="pt" aria-pressed="true">PT</button>
<button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
</div></div>
<header class="hero"><div class="in">
<div class="eyebrow" data-t="eyebrow"></div>
<h1 class="disp" data-t="title"></h1>
<p data-t="intro"></p>
<p class="sig" data-t="sig"></p>
</div></header>

<main class="wrap">
<div class="progress" id="progress"><div class="steps" id="bars"></div><div class="plabel" id="plabel"></div></div>
<form id="form" novalidate autocomplete="on">
<div class="card" id="card"></div>
<div class="nav">
<button type="button" class="btn sec" id="back"></button>
<button type="submit" class="btn pri" id="next"></button>
</div>
<p class="err" id="err" role="alert"></p>
<p class="saved" data-t="saved"></p>
</form>
</main>
<div class="foot">CMTeam · cmteam.us · bePatient | beHumble | beStrong</div>

var lang='pt',step=0,state={provas:[{}]};
try{var sv=JSON.parse(localStorage.getItem(STORE)||'null');if(sv){state=sv.state||state;step=Math.min(sv.step||0,STEPS.length-1);lang=sv.lang||lang;}}catch(e){}
var qp=new URLSearchParams(location.search);if(qp.get('lang')==='en'||qp.get('lang')==='pt')lang=qp.get('lang');

function localStorageHas(){try{return !!localStorage.getItem(STORE);}catch(e){return false;}}
if(!state.provas||!state.provas.length)state.provas=[{}];
function save(){try{localStorage.setItem(STORE,JSON.stringify({state:state,step:step,lang:lang}));}catch(e){}}

function tx(t){if(!t)return'';var s=typeof t==='string'?t:(t[lang]||t.pt);var u=U(state);return s.replace('{d}',u.d).replace('{w}',u.w).replace('{h}',u.h).replace('{sw}',u.sw);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function vis(x){return !x.show||x.show(state);}

var card=document.getElementById('card');
function fieldHTML(f){

 var hint=f.hint?'<div class="hint">'+esc(tx(f.hint))+'</div>':'';

 var v=state[f.id];
 if(f.type==='alert')return '<div class="alert full" style="grid-column:1/-1">'+esc(L.parqAlert)+'</div>';
 if(f.type==='consent')return '<label class="consent f full" data-f="'+f.id+'"><input type="checkbox" data-id="'+f.id+'"'+(v?' checked':'')+'><span>'+esc(tx(f.label))+' <span class="req">*</span></span></label>';
 if(['text','email','tel','date','number'].indexOf(f.type)>-1){
  h='<label for="'+id+'">'+lbl+'</label>'+hint+'<input id="'+id+'" type="'+f.type+'" data-id="'+f.id+'" value="'+esc(v)+'"'+(f.ac?' autocomplete="'+f.ac+'"':'')+(f.type==='number'?' inputmode="numeric" min="0"':'')+'>';
 }else if(f.type==='textarea'){
  h='<label for="'+id+'">'+lbl+'</label>'+hint+'<textarea id="'+id+'" data-id="'+f.id+'" rows="3">'+esc(v)+'</textarea>';
 }else if(f.type==='select'){
  h='<label for="'+id+'">'+lbl+'</label>'+hint+'<select id="'+id+'" data-id="'+f.id+'"><option value="">—</option>'+f.opts.map(function(x){return '<option value="'+x.v+'"'+(v===x.v?' selected':'')+'>'+esc(x[lang])+'</option>';}).join('')+'</select>';
 }else if(f.type==='radio'||f.type==='chips'){
  var multi=f.type==='chips';var arr=multi?(v||[]):[];
  h='<div class="lbl" id="'+id+'_l">'+lbl+'</div>'+hint+'<div class="opts'+(f.big?' big':'')+'" role="'+(multi?'group':'radiogroup')+'" aria-labelledby="'+id+'_l">'+f.opts.map(function(x){var ck=multi?arr.indexOf(x.v)>-1:v===x.v;return '<label class="opt"><input type="'+(multi?'checkbox':'radio')+'" name="'+id+'" data-id="'+f.id+'" value="'+x.v+'"'+(ck?' checked':'')+'><span>'+esc(x[lang])+'</span></label>';}).join('')+'</div>';
 }else if(f.type==='scale'){
  h='<div class="lbl" id="'+id+'_l">'+lbl+'</div>'+hint+'<div class="opts scale" role="radiogroup" aria-labelledby="'+id+'_l">'+[1,2,3,4,5].map(function(n){return '<label class="opt"><input type="radio" name="'+id+'" data-id="'+f.id+'" value="'+n+'"'+(String(v)===String(n)?' checked':'')+'><span>'+n+'</span></label>';}).join('')+'</div><div class="scalelegend"><span>'+esc(tx(f.lo)||L.scaleLo)+'</span><span>'+esc(tx(f.hi)||L.scaleHi)+'</span></div>';
 }else if(f.type==='matrix'){
  var rows=f.rows(state),m=v||{};
  h='<div class="lbl">'+lbl+'</div><div class="matrix"><table><thead><tr><th></th>'+DAYS.map(function(d){return '<th scope="col">'+d[lang]+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr><td>'+esc(r[lang])+'</td>'+DAYS.map(function(d){var k=r.v+'_'+d.v;return '<td><label class="cb"><input type="checkbox" data-mx="'+f.id+'" data-k="'+k+'"'+(m[k]?' checked':'')+' aria-label="'+esc(r[lang]+' '+d[lang])+'"></label></td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
 }else if(f.type==='races'){
  h=state.provas.map(function(p,i){return '<div class="race"><div class="grid">'+
   '<div class="f"><div class="lbl">'+L.race+' '+(i+1)+' · '+(lang==='pt'?'Prioridade':'Priority')+'</div><div class="opts" role="radiogroup">'+['A','B','C'].map(function(pr){return '<label class="opt"><input type="radio" name="pr'+i+'" data-race="'+i+'" data-k="prioridade" value="'+pr+'"'+(p.prioridade===pr?' checked':'')+'><span>'+pr+'</span></label>';}).join('')+'</div></div>'+
   '<div class="f"><label for="rn'+i+'">'+(lang==='pt'?'Nome da prova':'Race name')+'</label><input id="rn'+i+'" type="text" data-race="'+i+'" data-k="nome" value="'+esc(p.nome)+'"></div>'+
   '<div class="f"><label for="rd'+i+'">'+(lang==='pt'?'Data':'Date')+'</label><input id="rd'+i+'" type="date" data-race="'+i+'" data-k="data" value="'+esc(p.data)+'"></div>'+
   '<div class="f"><label for="rk'+i+'">'+(lang==='pt'?'Distância':'Distance')+'</label><input id="rk'+i+'" type="text" data-race="'+i+'" data-k="distancia" value="'+esc(p.distancia)+'"></div>'+
   '</div>'+(state.provas.length>1?'<button type="button" class="rm" data-rm="'+i+'">'+L.remove+'</button>':'')+'</div>';}).join('')+(state.provas.length<6?'<button type="button" class="addbtn" id="addRace">'+L.add+'</button>':'');
  return '<div class="f full">'+h+'</div>';
 }
 return '<div class="'+cls+'" data-f="'+f.id+'">'+h+'</div>';

function render(){
 var S=STEPS[step],L=UI[lang];
 document.documentElement.lang=lang==='pt'?'pt-BR':'en';
 document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=L[e.getAttribute('data-t')];});
 document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang?'true':'false');});
 document.getElementById('bars').innerHTML=STEPS.map(function(_,i){return '<span class="'+(i<step?'past':i===step?'cur':'')+'"></span>';}).join('');
 document.getElementById('plabel').textContent=L.step+' '+(step+1)+' '+L.of+' '+STEPS.length+' · '+tx(S.title);
 var h='<h2 class="disp">'+esc(tx(S.title))+'</h2><p class="lead">'+esc(tx(S.lead))+'</p>';
 S.blocks.forEach(function(b){if(!vis(b))return;var fs=b.fields.filter(vis);if(!fs.length)return;
  h+='<div class="sub">'+esc(tx(b.sub))+'</div>'+(b.note?'<p class="subnote">'+esc(tx(b.note))+'</p>':'')+'<div class="grid">'+fs.map(fieldHTML).join('')+'</div>';});
 card.innerHTML=h;
 document.getElementById('back').style.visibility=step===0?'hidden':'visible';
 document.getElementById('back').textContent=L.back;
 document.getElementById('next').textContent=step===STEPS.length-1?L.send:L.next;
 document.getElementById('err').textContent='';
}

/* ---------- eventos ---------- */
function onChange(e){
 var t=e.target,id=t.getAttribute('data-id');
 if(t.hasAttribute('data-mx')){var m=state[t.getAttribute('data-mx')]||{};m[t.getAttribute('data-k')]=t.checked;state[t.getAttribute('data-mx')]=m;}
 else if(t.hasAttribute('data-race')){state.provas[+t.getAttribute('data-race')][t.getAttribute('data-k')]=t.value;}
 else if(id){
  if(t.type==='checkbox'&&t.closest('.opts')){var a=state[id]||[];if(t.checked){if(a.indexOf(t.value)<0)a.push(t.value);}else a=a.filter(function(x){return x!==t.value;});state[id]=a;}
  else if(t.type==='checkbox')state[id]=t.checked;
  else state[id]=t.value;
  var fw=t.closest('.f');if(fw)fw.classList.remove('invalid');
  if(/^parq|^perfil$|^unidades$/.test(id)&&e.type==='change')render();
 }
 save();
}
card.addEventListener('input',onChange);card.addEventListener('change',onChange);
card.addEventListener('click',function(e){
 if(e.target.id==='addRace'){state.provas.push({});save();render();}
 var rm=e.target.getAttribute&&e.target.getAttribute('data-rm');if(rm!=null){state.provas.splice(+rm,1);save();render();}
});
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){lang=b.getAttribute('data-lang');save();render();});});
document.getElementById('back').addEventListener('click',function(){if(step>0){step--;save();render();scrollTop();}});
function scrollTop(){var y=document.querySelector('.wrap').getBoundingClientRect().top+scrollY;scrollTo({top:y,behavior:'smooth'});}

function empty(v){return v==null||v===''||v===false||(Array.isArray(v)&&!v.length);}
function validate(){
 var S=STEPS[step],bad=[];
 S.blocks.forEach(function(b){if(!vis(b))return;b.fields.forEach(function(f){if(!vis(f)||!f.req)return;var v=state[f.id];
  var ok=!empty(v);if(ok&&f.type==='email')ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
  if(!ok)bad.push(f.id);});});
 bad.forEach(function(id){var el=card.querySelector('[data-f="'+id+'"]');if(el)el.classList.add('invalid');});
 if(bad.length){document.getElementById('err').textContent=UI[lang].required;var first=card.querySelector('[data-f="'+bad[0]+'"]');if(first)first.scrollIntoView({behavior:'smooth',block:'center'});}
 return !bad.length;
}

/* ---------- envio ---------- */
function label(f){return(f.label&&f.label.pt||f.id).replace('{d}',U(state).d).replace('{w}',U(state).w).replace('{h}',U(state).h).replace('{sw}',U(state).sw);}
function human(f,v){
 if(f.opts&&!Array.isArray(v)){var x=f.opts.filter(function(o){return o.v===v;})[0];return x?x.pt:v;}
 if(f.opts&&Array.isArray(v))return v.map(function(val){var x=f.opts.filter(function(o){return o.v===val;})[0];return x?x.pt:val;}).join(', ');
 if(f.type==='consent')return v?'Sim, concordo':'';
 return v;
}

 var fd=new FormData(),n=0;
 var perfil={triathlon:'Triathlon',corrida:'Corrida de rua',trail:'Trail running'}[state.perfil]||'';
 fd.append('access_key',ACCESS_KEY);
 fd.append('subject','Cadastro de atleta — '+(state.nome||'')+' — '+perfil);
 fd.append('from_name','Cadastro CMTeam');
 fd.append('email',state.email||'');
 fd.append('botcheck','');
 fd.append('00 · Idioma do formulário',lang==='pt'?'Português':'Inglês');
 fd.append('00 · Fuso horário do aparelho',(Intl.DateTimeFormat().resolvedOptions().timeZone)||'');
 STEPS.forEach(function(S,si){S.blocks.forEach(function(b){if(!vis(b))return;b.fields.forEach(function(f){
  if(!vis(f)||f.type==='alert'||f.id==='email')return;var v=state[f.id],key=(si+1)+' '+S.title.pt+' · '+(b.sub.pt===S.title.pt?'':b.sub.pt+' · ')+label(f);
  if(f.type==='matrix'){var rows=f.rows(state),m=v||{};rows.forEach(function(r){var ds=DAYS.filter(function(d){return m[r.v+'_'+d.v];}).map(function(d){return d.pt;});if(ds.length)fd.append((si+1)+' '+S.title.pt+' · Disponibilidade · '+r.pt,ds.join(', '));});return;}
  if(f.type==='races'){(state.provas||[]).forEach(function(p,i){if(p.nome||p.data||p.distancia)fd.append((si+1)+' Provas · Prova '+(i+1),[p.prioridade?'Prioridade '+p.prioridade:'',p.nome,p.data,p.distancia].filter(Boolean).join(' · '));});return;}
  if(empty(v))return;
  if(f.id==='nome')key='01 · Nome';
  if(f.key)key=(si+1)+' '+S.title.pt+' · '+f.key;
  fd.append(key,String(human(f,v)));n++;
 });});});
 return fd;
}
document.getElementById('form').addEventListener('submit',function(e){
 e.preventDefault();
 if(!validate())return;
 if(step<STEPS.length-1){step++;save();render();scrollTop();return;}
 var btn=document.getElementById('next'),L=UI[lang];btn.disabled=true;btn.textContent=L.sending;
 fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Accept':'application/json'},body:payload()})
  .then(function(r){return r.json().then(function(j){if(!r.ok||j.success!==true)throw j;return j;});})
  .then(function(){
   try{localStorage.removeItem(STORE);}catch(e){}
   document.getElementById('form').innerHTML='<div class="card done"><h2 class="disp">'+esc(L.doneT)+'</h2><p class="lead">'+esc(L.doneP)+'</p><p style="font-weight:700;margin-top:18px">'+esc(L.doneS)+'</p></div>';
   document.getElementById('progress').style.display='none';scrollTop();
  })
  .catch(function(err){if(window.console)console.warn(err);document.getElementById('err').textContent=L.sendErr;btn.disabled=false;btn.textContent=L.send;});
});
render();
})();
</script>
